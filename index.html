<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5257">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Probador">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Probador virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F0; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#1D1A24; --muted:#5A6364; --line:#CDD5D3;
  --primary:#0F5257; --on-primary:#FFFFFF; --blush:#F4B4C2; --stage:#DCE4E2; --danger:#B3261E; --ok:#1F7A4D;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111615; --surface:#1A2120; --surface-2:#202928; --ink:#E7EDEC; --muted:#9AA6A5; --line:#2F3937;
    --primary:#6CC9CE; --on-primary:#06292B; --blush:#C9798C; --stage:#232C2B; --danger:#F2B8B5; --ok:#7FD3A8;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111615; --surface:#1A2120; --surface-2:#202928; --ink:#E7EDEC; --muted:#9AA6A5; --line:#2F3937;
  --primary:#6CC9CE; --on-primary:#06292B; --blush:#C9798C; --stage:#232C2B; --danger:#F2B8B5; --ok:#7FD3A8;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img,canvas,video{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.1;margin:0}
p{margin:0}
.hidden{display:none!important}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.03em;background:none;border:0;padding:0;cursor:pointer}
.brand-mark{width:26px;height:32px;border-radius:13px 13px 4px 4px;background:var(--blush);display:grid;place-items:center}
.brand-mark span{width:16px;height:22px;border-radius:8px 8px 2px 2px;background:var(--primary)}
.topnav{margin-left:auto;display:none;gap:4px}
.topnav a{padding:.45em .95em;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:500}
.topnav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:.72rem;font-weight:500;color:var(--muted);text-decoration:none;position:relative}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current="page"]{color:var(--primary)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--blush);color:#2A1219;font-size:.68rem;font-weight:600;display:grid;place-items:center}
.topnav .badge{position:static;display:inline-grid;margin-left:6px}
@media (min-width:820px){.topnav{display:flex}.tabs{display:none}}

main{max-width:1180px;margin:0 auto;padding:22px 16px 112px}
@media (min-width:820px){main{padding:30px 24px 56px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:.55em 1.15em;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.small{min-height:36px;padding:.3em .85em;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small-text{font-size:.88rem}

.hero{display:grid;gap:14px;padding:8px 0 26px;max-width:40rem}
.hero h1{font-size:clamp(2.1rem,7vw,3.6rem);font-weight:700}
.hero p{font-size:1.1rem;color:var(--muted);max-width:34rem}
.hero .row{margin-top:6px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4em .95em;font-weight:500;cursor:pointer;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
@media (min-width:820px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;cursor:pointer}
.card:hover{border-color:var(--ink)}
.thumb{background:var(--stage);display:grid;place-items:center;aspect-ratio:4/5;padding:14px;overflow:hidden}
.thumb canvas{max-width:100%;max-height:100%;width:auto;height:auto}
.card-body{padding:10px 12px 13px;display:grid;gap:4px}
.card-name{font-weight:600;line-height:1.25}
.card-price{font-family:var(--display);font-weight:600;font-size:1.05rem}
.dots{display:flex;gap:5px}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:28px 22px;display:grid;gap:12px;justify-items:start;max-width:36rem}
.empty h2{font-size:1.4rem}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.9rem;color:var(--muted);margin-bottom:16px}

/* Probador */
.tryon{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.tryon{grid-template-columns:minmax(0,1.05fr) minmax(330px,.95fr);align-items:start}}
.stage-col{display:grid;gap:14px;justify-items:center;min-width:0}
@media (min-width:920px){.stage-col{position:sticky;top:84px}}
.mirror{background:var(--blush);padding:10px;border-radius:50% 50% 22px 22px / 170px 170px 22px 22px;max-width:100%}
.mirror-inner{border-radius:50% 50% 14px 14px / 160px 160px 14px 14px;overflow:hidden;background:var(--stage);display:grid;place-items:center}
.mirror canvas{display:block;touch-action:none;cursor:grab}
.mirror canvas:active{cursor:grabbing}
.stage-empty{width:min(78vw,330px);aspect-ratio:3/4.4;display:grid;align-content:center;justify-items:center;gap:14px;padding:44px 26px 26px;text-align:center}
.stage-empty h2{font-size:1.5rem}
.stage-empty p{color:var(--muted);font-size:.95rem}
.stage-empty .col{display:grid;gap:8px;width:100%}
.stage-tip{font-size:.85rem;color:var(--muted);text-align:center;max-width:30rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px;min-width:0}
.panel h2{font-size:1.25rem}
.panel h3{font-size:1rem;font-family:var(--body);font-weight:600;letter-spacing:0}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.strip-item{flex:none;width:96px;display:grid;gap:4px;background:none;border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;text-align:left}
.strip-item:hover{border-color:var(--ink)}
.strip-item .thumb{aspect-ratio:1;border-radius:8px;padding:6px}
.strip-item span{font-size:.76rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.size{min-width:46px;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;cursor:pointer;padding:0 10px}
.size[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:grid;gap:6px}
.field>label,.field>.label{font-weight:600;font-size:.92rem}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--primary)}
.layers{display:grid;gap:6px}
.layer{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.layer[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.layer .thumb{width:44px;height:44px;aspect-ratio:auto;padding:4px;border-radius:8px;flex:none}
.layer div{min-width:0}
.layer strong{display:block;font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer small{color:var(--muted)}
.look-total{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
.look-total strong{font-family:var(--display);font-size:1.4rem}
.sel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Carrito y pedidos */
.page-title{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:18px}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.item .thumb{width:72px;height:72px;aspect-ratio:auto;padding:6px;border-radius:10px}
.item-name{font-weight:600}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.qty button{width:36px;height:34px;border:0;background:none;cursor:pointer;font-size:1.1rem}
.qty span{min-width:26px;text-align:center;font-weight:600}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;margin-top:16px;max-width:30rem;margin-left:auto}
.summary .total{display:flex;justify-content:space-between;font-family:var(--display);font-size:1.4rem;font-weight:700}
.order{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.order ul{margin:0;padding-left:1.1em;color:var(--muted);font-size:.93rem}
.status{display:inline-block;padding:.15em .7em;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.status.paid{background:color-mix(in srgb,var(--ok) 15%,transparent);border-color:transparent;color:var(--ok)}
.status.cancel{color:var(--danger)}

/* Gestión */
.subtabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.admin-row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.admin-row .thumb{width:56px;height:56px;aspect-ratio:auto;padding:4px;border-radius:8px}
.admin-row.off{opacity:.6}

/* Formularios */
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=password],select,textarea{width:100%;min-height:44px;padding:.55em .8em;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary)}
.checker{background-color:#fff;background-image:conic-gradient(#e4e4e4 25%,transparent 0 50%,#e4e4e4 0 75%,transparent 0);background-size:20px 20px;border-radius:12px;border:1px solid var(--line);min-height:200px;display:grid;place-items:center;padding:10px}
.checker canvas{max-height:260px;width:auto}
.color-row{display:grid;grid-template-columns:48px 1fr auto auto;gap:8px;align-items:center}
.color-row input[type=color]{width:48px;height:44px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mini{width:40px;height:40px;border-radius:8px;overflow:hidden;display:grid;place-items:center}
.mini canvas{max-width:100%;max-height:100%}

dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 20px));max-height:calc(100% - 24px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,14,.5)}
.dlg{display:grid;gap:16px;padding:20px;max-height:calc(100dvh - 24px);overflow:auto}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg-head h2{font-size:1.45rem}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.2rem;flex:none}
.prod-preview{background:var(--stage);border-radius:16px;display:grid;place-items:center;padding:18px;min-height:240px}
.prod-preview canvas{max-height:300px;width:auto}
.price-big{font-family:var(--display);font-weight:700;font-size:1.6rem}
.cam-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;display:grid;place-items:center;min-height:300px}
.cam-wrap video{display:block;width:100%;max-height:62vh;object-fit:contain}
.countdown{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:6rem;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.6);pointer-events:none}
.err{color:var(--danger);font-size:.9rem}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7em 1.1em;border-radius:12px;font-weight:500;z-index:30;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (min-width:820px){#toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="brand" type="button" aria-label="Ir al catálogo"><span class="brand-mark" aria-hidden="true"><span></span></span><span id="storeName">Probador</span></button>
  <nav class="topnav" id="topnav" aria-label="Principal"></nav>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="Principal"></nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileCam" accept="image/*" capture="user" hidden>
<input type="file" id="fileGal" accept="image/*" hidden>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

}

function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }

/* ---------- Categorías y colocación por defecto ---------- */

const imgCache = new Map(), tintCache = new Map();
function srcOf(ref) {
  if (typeof ref !== 'string') return null;
  if (/^[0-9a-f]{32}$/.test(ref)) return '/_blob/' + ref;
  if (ref.startsWith('data:image/')) return ref;
  return null;
}
function loadImg(src) {
  if (!src) return Promise.reject(new Error('sin imagen'));
  if (!imgCache.has(src)) imgCache.set(src, new Promise((res, rej) => {
    const i = new Image(); i.decoding = 'async';
    i.onload = () => res(i); i.onerror = () => { imgCache.delete(src); rej(new Error('no carga')); };
    i.src = src;
  }));
  return imgCache.get(src);
}
const dims = (s) => [s.naturalWidth || s.width, s.naturalHeight || s.height];
async function variant(p, ci) {
  const c = (p.colors || [])[ci];
  const own = c && srcOf(c.image);
  if (own) return loadImg(own);
  const base = await loadImg(srcOf(p.image));
  if (!p.tint || !c || !isHex(c.hex)) return base;
  const key = p.image + '|' + c.hex;
  if (tintCache.has(key)) return tintCache.get(key);
  const [w, hh] = dims(base);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
  const x = cv.getContext('2d');
  x.drawImage(base, 0, 0, w, hh);
  x.globalCompositeOperation = 'multiply'; x.fillStyle = c.hex; x.fillRect(0, 0, w, hh);
  x.globalCompositeOperation = 'destination-in'; x.drawImage(base, 0, 0, w, hh);
  tintCache.set(key, cv);
  return cv;
}
function drawFit(cv, src, max) {
  const [w, hh] = dims(src); const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(max / w, max / hh, 1.5);
  cv.width = Math.max(1, Math.round(w * s * dpr)); cv.height = Math.max(1, Math.round(hh * s * dpr));
  cv.style.width = Math.round(w * s) + 'px'; cv.style.height = Math.round(hh * s) + 'px';
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
}
function thumb(p, ci = 0, max = 220) {
  const box = h('div', { class: 'thumb' }); const cv = h('canvas', { 'aria-hidden': 'true' }); box.append(cv);
  if (p) variant(p, ci).then(src => drawFit(cv, src, max)).catch(() => {});
  return box;
}

async function boot() {
  route(); renderNav();
  const view = $('#view'); view.replaceChildren(h('p', { class: 'muted' }, 'Cargando la tienda…'));
  let db = null, user = null;
  if (window.claude && typeof window.claude.use === 'function') {
    [db, user, S.downloads] = await Promise.all([
      window.claude.use('db').catch(() => null),
      window.claude.use('user').catch(() => null),
      window.claude.use('downloads').catch(() => null)
    ]);
  }
  if (db) await startRemote(db, user);
  else if (firebaseReady()) {
    try { await startFirebase(); }
    catch (e) { console.error(e); S.fbError = 'No se pudo conectar con Firebase. Revisa config.js y que la autenticación anónima esté activada.'; startLocal(); }
  } else startLocal();
  renderNav(); mount();
}
async function startRemote(db, user) {
  S.backend = 'claude'; S.user = user;
  if (user) {
    try { S.uid = await user.id(); } catch {}
    try { S.isAdmin = await user.canEdit(); } catch {}
    try { S.canWrite = await user.can('data.write'); } catch {}
  }
  if (S.isAdmin) { try { S.assets = await window.claude.use('assets'); } catch {} }
  subscribe(db);
}
function firebaseReady() { const c = window.FIREBASE_CONFIG; return !!(window.firebase && c && c.apiKey && c.projectId); }
async function startFirebase() {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth = firebase.auth(); const fs = firebase.firestore();
  try { await fs.enablePersistence({ synchronizeTabs: true }); } catch {}
  const u = await new Promise((res, rej) => {
    const un = auth.onAuthStateChanged(async (usr) => {
      if (usr) { un(); res(usr); return; }
      try { await auth.signInAnonymously(); } catch (e) { un(); rej(e); }
    });
  });
  S.backend = 'firebase'; S.auth = auth; S.uid = u.uid;
  const admins = (window.ADMIN_EMAILS || []).map(e => String(e).trim().toLowerCase());
  S.isAdmin = !u.isAnonymous && !!u.email && admins.includes(u.email.toLowerCase());
  subscribe(fs);
}
function subscribe(db) {
  S.mode = 'remote'; S.db = db;
  const timer = setTimeout(() => { if (!S.loaded) { S.offlineNote = 'No se puede conectar con el catálogo todavía. Revisa tu conexión.'; refresh(); } }, 10000);
  db.collection('catalog').onSnapshot(snap => {
    S.products = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
    if (!snap.metadata.fromCache) { S.loaded = true; S.offlineNote = ''; clearTimeout(timer); }
    else S.loaded = S.loaded || snap.size > 0;
    pruneLayers(); refresh();
  }, () => { clearTimeout(timer); S.loaded = true; S.offlineNote = 'El catálogo no está disponible ahora mismo.'; refresh(); });
  db.doc('settings/store').onSnapshot(s => { if (s.exists) S.settings = { ...S.settings, ...s.data() }; applySettings(); refresh(); }, () => {});
  if (S.uid) db.doc('orders/' + S.uid).onSnapshot(s => { S.myOrders = s.exists ? (s.data().list || []) : []; if (S.route === 'pedidos') refresh(); }, () => {});
  if (S.isAdmin) db.collection('orders').onSnapshot(s => {
    S.allOrders = s.docs.flatMap(d => (d.data().list || []).map(o => ({ ...o, _owner: d.id }))).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    if (S.route === 'gestion') refresh();
  }, () => {});
}
function startLocal() {
  S.mode = 'local'; S.isAdmin = true; S.loaded = true;
  L = lsGet('probador.local', { products: [], settings: { name: 'Probador', currency: 'EUR' }, orders: [] });
  S.products = L.products; S.settings = { ...S.settings, ...L.settings };
  S.myOrders = L.orders; S.allOrders = L.orders.map(o => ({ ...o, _owner: 'local' }));
  applySettings();
}
function saveLocal() {
  const ok = lsSet('probador.local', L);
  S.products = L.products; S.myOrders = L.orders; S.allOrders = L.orders.map(o => ({ ...o, _owner: 'local' }));
  if (!ok) toast('El navegador no tiene más espacio para guardar imágenes.');
}
function applySettings() {
  const n = S.settings.name || 'Probador';
  $('#storeName').textContent = n; document.title = n + ' · probador virtual';
}

async function canvasToBlob(cv, type = 'image/png', q) { return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('blob')), type, q)); }
async function storeImage(cv) {
  if (S.mode === 'remote' && S.backend === 'claude') {
    if (!S.assets) throw new Error('No tienes permiso para subir imágenes en esta vista.');
    const blob = await canvasToBlob(cv);
    const up = await S.assets.upload(blob, { type: 'image/png' });
    return up.id;
  }
  return compactData(shrink(cv, S.backend === 'firebase' ? 800 : 700));
}
function compactData(cv) { const w = cv.toDataURL('image/webp', 0.85); return w.startsWith('data:image/webp') ? w : cv.toDataURL('image/png'); }
async function storeSvg(svg) {
  if (S.mode === 'remote' && S.backend === 'claude') {
    if (!S.assets) throw new Error('No tienes permiso para subir imágenes en esta vista.');
    const up = await S.assets.upload(new Blob([svg], { type: 'image/svg+xml' }), { type: 'image/svg+xml' });
    return up.id;
  }
  try { const img = await loadImg(svgData(svg)); const cv = document.createElement('canvas'); [cv.width, cv.height] = dims(img); cv.getContext('2d').drawImage(img, 0, 0); return cv.toDataURL('image/png'); }
  catch { return svgData(svg); }
}
async function saveProductRecord(id, rec) {
  if (S.backend === 'firebase' && JSON.stringify(rec).length > 950000) throw new Error('Las fotos ocupan demasiado. Usa imágenes más pequeñas o menos colores con foto propia.');
  if (S.mode === 'remote') {
    const ref = id ? S.db.doc('catalog/' + id) : S.db.collection('catalog').doc();
    await ref.set(rec);
  } else {
    if (id) { const i = L.products.findIndex(p => p.id === id); if (i >= 0) L.products[i] = { id, ...rec }; }
    else L.products.unshift({ id: uidGen(), ...rec });
    saveLocal(); refresh();
  }
}
async function deleteProduct(p) {
  if (S.mode === 'remote') {
    await S.db.doc('catalog/' + p.id).delete();
    const ids = [p.image, ...(p.colors || []).map(c => c.image)].filter(x => /^[0-9a-f]{32}$/.test(x || ''));
    if (S.assets) for (const a of ids) { try { await S.assets.delete(a); } catch {} }
  } else { L.products = L.products.filter(x => x.id !== p.id); saveLocal(); refresh(); }
}
async function placeOrder(order) {
  if (S.mode === 'local') { L.orders.unshift(order); saveLocal(); return; }
  if (!S.uid) { const e = new Error('Inicia sesión para hacer pedidos.'); throw e; }
  const ref = S.db.doc('orders/' + S.uid);
  const snap = await ref.get();
  const list = snap.exists ? [...(snap.data().list || [])] : [];
  list.unshift(order);
  await ref.set({ list: list.slice(0, 150) });
}
async function setOrderStatus(owner, orderId, status) {
  if (S.mode === 'local') { const o = L.orders.find(x => x.id === orderId); if (o) o.status = status; saveLocal(); return; }
  const ref = S.db.doc('orders/' + owner);
  const snap = await ref.get(); if (!snap.exists) return;
  const list = (snap.data().list || []).map(o => o.id === orderId ? { ...o, status } : o);
  await ref.set({ list });
}
async function saveSettings(st) {
  if (S.mode === 'remote') await S.db.doc('settings/store').set(st);
  else { L.settings = st; S.settings = { ...S.settings, ...st }; saveLocal(); applySettings(); }
}

    h('button', { class: 'btn', type: 'button', onclick: () => { facing = facing === 'user' ? 'environment' : 'user'; start(); } }, 'Cambiar cámara'),

  for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) if (p[(yy * W + xx) * 4 + 3] > 12) { if (xx < minX) minX = xx; if (xx > maxX) maxX = xx; if (yy < minY) minY = yy; if (yy > maxY) maxY = yy; }
  if (maxX < 0) return cv;
  const o = document.createElement('canvas'); o.width = maxX - minX + 1; o.height = maxY - minY + 1;
  o.getContext('2d').drawImage(cv, minX, minY, o.width, o.height, 0, 0, o.width, o.height);
  return o;
}

function openProductForm(p) {
  const f = {
    name: p?.name || '', price: p?.price ?? '', category: p?.category || 'top', description: p?.description || '',
    sizes: (p?.sizes || CATS[p?.category || 'top'].sizes).join(', '), sizesTouched: !!p,
    tint: p ? !!p.tint : true, active: p ? p.active !== false : true, image: p?.image || null,
    colors: (p?.colors && p.colors.length ? p.colors : [{ name: 'Original', hex: '#FFFFFF' }]).map(c => ({ name: c.name || '', hex: isHex(c.hex) ? c.hex : '#FFFFFF', image: c.image || null, processed: null })),
    raw: null, processed: null, remove: true, tol: 40
  };
  const err = h('p', { class: 'err', role: 'alert' });
  const prev = h('div', { class: 'checker' });
  const showPrev = () => {
    const cv = h('canvas', { 'aria-hidden': 'true' }); prev.replaceChildren(cv);
    if (f.processed) drawFit(cv, f.processed, 260);
    else if (f.image) loadImg(srcOf(f.image)).then(s => drawFit(cv, s, 260)).catch(() => prev.replaceChildren(h('span', { class: 'muted' }, 'Sin imagen')));
    else prev.replaceChildren(h('span', { class: 'muted' }, 'Sube la foto de la prenda'));
  };
  let tTol; const reprocess = () => { if (!f.raw) return; f.processed = processImage(f.raw, f.remove, f.tol); showPrev(); };
  const fileIn = h('input', { type: 'file', accept: 'image/*', id: 'pfImg', class: 'hidden', onchange: async (e) => { const file = e.target.files[0]; e.target.value = ''; if (!file) return; try { f.raw = await fileToImage(file); reprocess(); } catch { err.textContent = 'No se pudo abrir esa imagen.'; } } });
  const tolIn = h('input', { type: 'range', min: '5', max: '120', value: String(f.tol), 'aria-label': 'Sensibilidad al quitar el fondo', oninput: (e) => { f.tol = +e.target.value; clearTimeout(tTol); tTol = setTimeout(reprocess, 180); } });
  const sizesIn = h('input', { id: 'pfSizes', type: 'text', value: f.sizes, oninput: (e) => { f.sizes = e.target.value; f.sizesTouched = true; } });
  const catSel = h('select', { id: 'pfCat', onchange: (e) => { f.category = e.target.value; if (!f.sizesTouched) { f.sizes = CATS[f.category].sizes.join(', '); sizesIn.value = f.sizes; } } },
    Object.entries(CATS).map(([k, c]) => { const o = h('option', { value: k }, c.label); if (k === f.category) o.selected = true; return o; }));
  const colorsBox = h('div', { class: 'form', style: 'gap:8px' });
  const drawColors = () => colorsBox.replaceChildren(...f.colors.map((c, i) => {
    const mini = h('div', { class: 'mini checker', style: 'min-height:0;padding:2px' });
    const mc = h('canvas'); mini.append(mc);
    if (c.processed) drawFit(mc, c.processed, 36); else if (c.image) loadImg(srcOf(c.image)).then(s => drawFit(mc, s, 36)).catch(() => {}); else mini.replaceChildren();
    const fi = h('input', { type: 'file', accept: 'image/*', class: 'hidden', onchange: async (e) => { const file = e.target.files[0]; e.target.value = ''; if (!file) return; try { c.processed = processImage(await fileToImage(file), f.remove, f.tol); drawColors(); } catch { err.textContent = 'No se pudo abrir esa imagen.'; } } });
    return h('div', { class: 'color-row' },
      h('input', { type: 'color', value: c.hex.toLowerCase(), 'aria-label': 'Color ' + (i + 1), oninput: (e) => { c.hex = e.target.value.toUpperCase(); } }),
      h('input', { type: 'text', value: c.name, placeholder: 'Nombre del color', 'aria-label': 'Nombre del color ' + (i + 1), oninput: (e) => { c.name = e.target.value; } }),
      h('div', { class: 'row', style: 'gap:4px' }, (c.image || c.processed) ? mini : null, h('button', { class: 'btn small', type: 'button', title: 'Foto propia de este color', onclick: () => fi.click() }, (c.image || c.processed) ? 'Cambiar foto' : 'Foto'), fi),
      h('button', { class: 'btn small danger', type: 'button', 'aria-label': 'Quitar color', disabled: f.colors.length <= 1, onclick: () => { f.colors.splice(i, 1); drawColors(); } }, '×'));
  }));
  showPrev(); drawColors();
  const saveBtn = h('button', { class: 'btn primary', type: 'submit' }, p ? 'Guardar cambios' : 'Guardar producto');
  const form = h('form', { class: 'form', novalidate: true, onsubmit: async (e) => {
    e.preventDefault(); err.textContent = '';
    const name = form.querySelector('#pfName').value.trim(); const price = parseFloat(String(form.querySelector('#pfPrice').value).replace(',', '.'));
    if (!name) { err.textContent = 'Escribe el nombre del producto.'; return; }
    if (!(price >= 0)) { err.textContent = 'Escribe un precio válido.'; return; }
    if (!f.processed && !f.image) { err.textContent = 'Sube una foto de la prenda.'; return; }
    const sizes = f.sizes.split(',').map(s => s.trim()).filter(Boolean).slice(0, 20);
    saveBtn.disabled = true; saveBtn.textContent = 'Guardando…';
    try {
      const image = f.processed ? await storeImage(f.processed) : f.image;
      const colors = [];
      for (const c of f.colors) { const o = { name: c.name.trim() || 'Color', hex: isHex(c.hex) ? c.hex : '#FFFFFF' }; const im = c.processed ? await storeImage(c.processed) : c.image; if (im) o.image = im; colors.push(o); }
      const now = new Date().toISOString();
      await saveProductRecord(p ? p.id : null, { name, price: Math.round(price * 100) / 100, category: f.category, description: form.querySelector('#pfDesc').value.trim(), sizes: sizes.length ? sizes : ['Única'], colors, tint: form.querySelector('#pfTint').checked, active: form.querySelector('#pfActive').checked, image, createdAt: p?.createdAt || now, updatedAt: now });
      tintCache.clear(); closeDialog(); toast(p ? 'Cambios guardados' : 'Producto guardado');
    } catch (ex) {
      saveBtn.disabled = false; saveBtn.textContent = p ? 'Guardar cambios' : 'Guardar producto';
      err.textContent = ex && ex.message && !ex.code ? ex.message : (ex && ex.code === 'quota_exceeded' ? 'No queda espacio para más imágenes o productos.' : 'No se pudo guardar. Inténtalo de nuevo.');
    }
  } },
    h('div', { class: 'field' }, h('div', { class: 'label' }, 'Foto de la prenda'), prev,
      h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: () => fileIn.click() }, svgIcon(ICONS.image), f.image ? 'Cambiar foto' : 'Elegir foto'), fileIn),
      h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: f.remove, onchange: (e) => { f.remove = e.target.checked; reprocess(); } }), h('span', null, 'Quitar el fondo liso automáticamente')),
      h('div', { class: 'range' }, h('span', { class: 'small-text muted' }, 'Sensibilidad'), tolIn),
      h('p', { class: 'muted small-text' }, 'Funciona mejor con la prenda de frente, sin arrugas y sobre fondo blanco o de un solo color. También puedes subir un PNG sin fondo.')),
    h('div', { class: 'field' }, h('label', { for: 'pfName' }, 'Nombre'), h('input', { id: 'pfName', type: 'text', value: f.name })),
    h('div', { class: 'two' },
      h('div', { class: 'field' }, h('label', { for: 'pfPrice' }, 'Precio (' + (S.settings.currency || 'EUR') + ')'), h('input', { id: 'pfPrice', type: 'text', inputmode: 'decimal', value: String(f.price) })),
      h('div', { class: 'field' }, h('label', { for: 'pfCat' }, 'Categoría'), catSel)),
    h('div', { class: 'field' }, h('label', { for: 'pfDesc' }, 'Descripción'), h('textarea', { id: 'pfDesc' }, f.description)),
    h('div', { class: 'field' }, h('label', { for: 'pfSizes' }, 'Tallas, separadas por comas'), sizesIn),
    h('div', { class: 'field' }, h('div', { class: 'label' }, 'Colores'), colorsBox, h('div', null, h('button', { class: 'btn small', type: 'button', onclick: () => { f.colors.push({ name: '', hex: '#2E2E30', image: null, processed: null }); drawColors(); } }, 'Añadir color'))),
    h('label', { class: 'check' }, h('input', { id: 'pfTint', type: 'checkbox', checked: f.tint }), h('span', null, 'Teñir la foto con el color elegido. Actívalo si la foto base es blanca o gris claro; los colores con foto propia no se tiñen.')),
    h('label', { class: 'check' }, h('input', { id: 'pfActive', type: 'checkbox', checked: f.active }), h('span', null, 'Visible en el catálogo')),
    err, h('div', { class: 'row' }, saveBtn, h('button', { class: 'btn ghost', type: 'button', onclick: closeDialog }, 'Cancelar')));
  openDialog(p ? 'Editar producto' : 'Nuevo producto', form);
}

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

boot();
})();
</script>
